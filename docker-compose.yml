services:
  frontend:
    build: 
      context: ./frontend
      args:
        - VITE_API_URL=https://api.supplychain-booster.chiragjoshi.online
    restart: unless-stopped
    networks:
      - web
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.modus-frontend.rule=Host(`supplychain-booster.chiragjoshi.online`)"
      - "traefik.http.routers.modus-frontend.entrypoints=websecure"
      - "traefik.http.routers.modus-frontend.tls.certresolver=letsencrypt"
      - "traefik.http.services.modus-frontend.loadbalancer.server.port=80"

  backend:
    build: 
      context: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=sqlite:////app/data/value_chain.db
    volumes:
      - backend_data:/app/data
      - backend_chromadb:/app/chroma_db
    networks:
      - web
    labels:
      - "traefik.enable=true"
      # The backend gets its own "api." subdomain
      - "traefik.http.routers.modus-backend.rule=Host(`api.supplychain-booster.chiragjoshi.online`)"
      - "traefik.http.routers.modus-backend.entrypoints=websecure"
      - "traefik.http.routers.modus-backend.tls.certresolver=letsencrypt"
      - "traefik.http.services.modus-backend.loadbalancer.server.port=8000"

networks:
  web:
    external: true

volumes:
  backend_data:
  backend_chromadb:
